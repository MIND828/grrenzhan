<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="闵叮 — UI / 视觉 / 网页设计师作品集。专注 B 端后台、数据看板与工业产品视觉设计。" />
    <!-- 字体：preconnect 提前建连，stylesheet 用 media 切换避免阻塞首屏渲染（display=swap 兜底无不可见文字） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
    <!-- 首屏 LCP 关键图提前加载 -->
    <link rel="preload" as="image" href="/hero-visual.webp" />
    <script>
      // 在首屏绘制前标记 JS 可用：CSS 据此隐藏待入场元素，避免无 JS 时内容空白与入场前闪烁
      document.documentElement.classList.add("js");
    </script>
    <title>闵叮 · UI & Visual Designer Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
